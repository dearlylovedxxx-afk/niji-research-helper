name: POV description fallback patch once
on:
  push:
    paths:
      - .github/workflows/patch_pov_supplement_once.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply one-time bounded POV supplement patch
        run: python3 .github/scripts/patch_pov_supplement_once.py
      - name: Check syntax and patch boundaries
        run: |
          node --check Niji_Research_Helper.user.js
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          s=Path('Niji_Research_Helper.user.js').read_text()
          assert s.count('function attachPovSupplement(')==1
          assert s.count('attachPovSupplement(source, matches, syncOffset);')==1
          assert "const NRH_DB_NAME = 'NijiResearchHelperDB'" in s
          assert "const CLOUD_STORES = ['videos','channels','wiki','pairs']" in s
          assert "// @version      1.0.40" in s
          print('PASS: syntax, one UI hook, old DB and cloud stores unchanged')
          PY
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = Niji_Research_Helper.user.js
      - name: Commit validated helper update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Niji_Research_Helper.user.js
          git commit -m 'Add on-demand description and YouTube POV supplement v1.0.40'
          git push origin HEAD:main