name: Add collaborator tri-state filters (one time)
on:
  push:
    paths:
      - .github/workflows/nrh-collab-three-state-once.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch collaborator filters without replacing research DB
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object Niji_Research_Helper.user.js)" = "e07205ccf07981ccb242a21c00c294ed36a6fd20"
          python3 - <<'PY'
          import base64, zlib
          payload = '')))
          PY
          node --check Niji_Research_Helper.user.js
          python3 - <<'PY'
          from pathlib import Path
          text = Path('Niji_Research_Helper.user.js').read_text(encoding='utf-8')
          assert '// @version      1.0.21' in text
          assert text.count('const researchCardOriginalDisplay = new WeakMap();') == 1
          assert 'research.collaboratorExcluded.clear();' in text
          assert 'function cycleResearchCollaborator(' in text
          assert 'const show = tagOk && includeOk && excludeOk && !personExcluded && personIncluded;' in text
          assert "const CLOUD_URL = 'https://niji-research-backup.dearlylovedxxx.workers.dev';" in text
          print('PASS: JS syntax, multi-person exclusion, reset, backup endpoint preserved')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Niji_Research_Helper.user.js
          git commit -m 'Add multi-person tri-state collaborator include and exclude (v1.0.21)'
          git push