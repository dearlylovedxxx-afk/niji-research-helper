name: Release XSF like parser v1.1.1
on:
  push:
    paths:
      - .github/workflows/xsf_like_parse_v111_once.yml
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch count fallback
        run: python .github/scripts/xsf_like_parse_v111_once.py
      - name: Verify
        run: |
          node --check X_Search_Favorites.user.js
          git diff --check
          node <<'JS'
          const fs=require('fs'),vm=require('vm'),assert=require('assert');
          const s=fs.readFileSync('X_Search_Favorites.user.js','utf8');
          assert(s.includes('// @version      1.1.1'));
          const start=s.indexOf('function parseLike('),end=s.indexOf('function captureLikes()',start);
          const c={};vm.createContext(c);
          vm.runInContext(s.slice(start,end)+'\nthis.test={tweetLikes,parseLike};',c);
          const fake=txt=>({querySelector:()=>({getAttribute:()=>null,closest:()=>null,textContent:txt,parentElement:{textContent:'15 100 500'}})});
          assert.equal(c.test.tweetLikes(fake('2.3K')),2300);
          assert.equal(c.test.tweetLikes(fake('1.2万')),12000);
          assert.equal(c.test.tweetLikes(fake('')),null);
          console.log('PASS extracted X like counts; no unrelated counts from action row');
          JS
      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add X_Search_Favorites.user.js
          git commit -m "Read compact like count on X action button (v1.1.1)"
          git push origin HEAD:main
