name: Release multiword OR workflow v0.4.0
on:
  push:
    paths:
      - .github/workflows/or_multiword_release_once.yml
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply guarded patch
        run: python .github/scripts/or_multiword_v040.py
      - name: Syntax and compatibility checks
        run: |
          node --check Niji_OR_Results_Merger.user.js
          git diff --check
          node - <<'JS'
          const fs=require('fs'),assert=require('assert');
          const s=fs.readFileSync('Niji_OR_Results_Merger.user.js','utf8');
          assert(s.includes('// @version      0.4.0'));
          assert(s.includes("const MULTI_KEY = 'niji_or_merger_addon_multi_v1';"));
          assert(s.includes('async function startMultiOr'));
          assert(s.includes('async function resumeMultiOr'));
          assert(s.includes("button('🔀 OR検索開始',startMultiOr,'primary')"));
          assert(s.includes("const STORAGE_KEY = 'niji_or_merger_addon_batches_v1';"));
          console.log('PASS OR v0.4.0');
          JS
      - name: Publish tested script
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Niji_OR_Results_Merger.user.js
          git commit -m "Automate multiword OR searches in one run (v0.4.0)"
          git push origin HEAD:main
