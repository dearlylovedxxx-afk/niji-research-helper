name: Release OR minimum comments v0.4.4
on:
  push:
    paths:
      - .github/workflows/or_v044_release_once.yml
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply guarded patch
        run: python .github/scripts/or_v044_minimum_once.py
      - name: Check syntax and min-count integration
        run: |
          node --check Niji_OR_Results_Merger.user.js
          git diff --check
          node - <<'JS'
          const assert=require('assert'),fs=require('fs');
          const s=fs.readFileSync('Niji_OR_Results_Merger.user.js','utf8');
          assert(s.includes('// @version      0.4.4'));
          assert(s.includes("const MIN_COMMENTS_KEY = 'niji_or_merger_addon_minimum_v1';"));
          assert(s.includes("data.set('least_count',String(minimum));"));
          assert(s.includes("if (!isDetailPage()) {"));
          assert(s.includes('minComments,index:0,stage:'));
          assert(s.includes('最低コメント数（1語・1動画あたり）'));
          assert(s.includes("const STORAGE_KEY = 'niji_or_merger_addon_batches_v1';"));
          assert(s.includes("const RUN_KEY = 'niji_or_merger_addon_run_v041';"));
          const line=s.slice(s.indexOf('function keywordSearchUrl('),s.indexOf('async function goRun('));
          assert(line.indexOf("data.set('keyword',word)")<line.indexOf("data.set('least_count',String(minimum))"));
          assert(line.indexOf("data.set('least_count',String(minimum))")<line.indexOf('action.search=data.toString()'));
          assert(s.includes('await storeSet(MIN_COMMENTS_KEY,minComments);'));
          console.log('PASS: OR native minimum filter, per-run snapshot, persisted input, untouched legacy DB keys');
          JS
      - name: Publish tested userscript
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Niji_OR_Results_Merger.user.js
          git commit -m "Filter OR video candidates by minimum comments before collection (v0.4.4)"
          git push origin HEAD:main
