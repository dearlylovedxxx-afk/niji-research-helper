name: Fix common cloud userscript update metadata once
on:
  push:
    paths:
      - .github/workflows/fix_cloud_update_metadata_once.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Patch metadata
        run: python3 .github/scripts/fix_cloud_update_metadata_once.py
      - name: Validate user scripts
        run: |
          node --check Niji_Cloud_Backup.user.js
          node --check Niji_OR_Results_Merger.user.js
          python3 - <<'PY'
          from pathlib import Path
          common=Path('Niji_Cloud_Backup.user.js').read_text()
          or_script=Path('Niji_OR_Results_Merger.user.js').read_text()
          assert '// @version      0.1.2' in common
          assert 'main/Niji_Cloud_Backup.user.js' in common.split('// ==/UserScript==')[0]
          assert '// @version      0.4.10' in or_script
          assert '// @updateURL' in or_script.split('// ==/UserScript==')[0]
          print('PASS: Node syntax and metadata for both scripts')
          PY
      - name: Publish fixed metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Niji_Cloud_Backup.user.js
          git commit -m 'Fix common cloud backup update URL metadata'
          git push origin HEAD:main
