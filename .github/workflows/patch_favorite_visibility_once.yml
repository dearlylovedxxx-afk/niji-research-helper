name: Patch favorite visibility once
on:
  push:
    paths:
      - '.github/workflows/patch_favorite_visibility_once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch userscript
        run: python .github/scripts/patch_favorite_visibility_once.py
      - name: Validate
        run: |
          node --check Niji_Research_Helper.user.js
          grep -q "// @version      1.0.48" Niji_Research_Helper.user.js
          grep -q "保存済みのお気に入りチャンネルは0件です。" Niji_Research_Helper.user.js
          grep -q "候補未読込" Niji_Research_Helper.user.js
          git diff --check
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Niji_Research_Helper.user.js
          git diff --cached --quiet && exit 1
          git commit -m 'Keep saved channel favorites visible v1.0.48'
          git push origin HEAD:main
