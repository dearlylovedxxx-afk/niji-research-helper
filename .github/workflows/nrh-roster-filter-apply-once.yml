name: Verify official Wiki roster filter (one time)
on:
  push:
    paths:
      - .github/workflows/nrh-roster-filter-apply-once.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch script and validate JavaScript syntax
        run: |
          python3 .github/scripts/nrh_roster_filter_patch_once.py
          node --check Niji_Research_Helper.user.js
      - name: Test real Wiki roster and strict outsider classification
        run: |
          python3 - <<'PY'
          import requests
          url='https://wikiwiki.jp/nijisanji/%E5%85%AC%E5%BC%8F%E3%83%A9%E3%82%A4%E3%83%90%E3%83%BC'
          r=requests.get(url,timeout=25,headers={'User-Agent':'Mozilla/5.0'});r.raise_for_status()
          open('/tmp/nrh-official-roster.html','w',encoding='utf-8').write(r.text)
          print('Wiki roster HTTP',r.status_code,'bytes',len(r.content))
          PY
          npm install --no-save --silent --prefix /tmp/nrh-roster-node jsdom@26
          node - <<'JS'
          const fs=require('node:fs'), assert=require('node:assert/strict');
          const {JSDOM}=require('/tmp/nrh-roster-node/node_modules/jsdom');
          const s=fs.readFileSync('Niji_Research_Helper.user.js','utf8');
          const text=s.match(/  function normalizeResearchText\(s = ''\) \{[\s\S]*?\n  \}/);
          const norm=s.match(/  function normalizeCollaboratorName\(name = ''\) \{[\s\S]*?\n  \}/);
          assert(text && norm,'normalization function missing');
          const start=s.indexOf('  const RESEARCH_COLLAB_GROUPS = '),end=s.indexOf('  function paintResearchCollaboratorButton(',start);
          assert(start>0&&end>start,'roster section missing');
          const impl=new Function('DOMParser','WIKI_BASE',`${text[0]}\n${norm[0]}\n${s.slice(start,end)}\nreturn {parseNijisanjiRosterHtml,researchRosterKey,researchCollaboratorOrgGroups,researchRoster};`)(new JSDOM('').window.DOMParser,'https://wikiwiki.jp/nijisanji');
          const roster=impl.parseNijisanjiRosterHtml(fs.readFileSync('/tmp/nrh-official-roster.html','utf8'));
          console.log('Parsed current members:',roster.members,'aliases:',roster.names.length);
          assert(roster.members>=190&&roster.members<=260);
          impl.researchRoster.names=new Set(roster.names);
          impl.researchRoster.ready=true;
          const key=impl.researchRosterKey;
          for(const n of ['小柳ロウ','叶','Elira Pendora'])assert(impl.researchRoster.names.has(key(n)),'missing current member: '+n);
          for(const n of ['白雪レイド','渋谷ハル','だるまいずごっど','勇気ちひろ'])assert(!impl.researchRoster.names.has(key(n)),'false Nijisanji membership: '+n);
          const groups=impl.researchCollaboratorOrgGroups;
          assert.deepEqual([...groups({collaborators:['小柳ロウ','白雪レイド']})].sort(),['nijisanji','outside']);
          assert.deepEqual([...groups({collaborators:['渋谷ハル']})],['outside']);
          assert.deepEqual([...groups({collaborators:['勇気ちひろ']})],['outside']);
          assert.deepEqual([...groups({meta:{mentions:[{name:'白雪レイド',org:'Nijisanji'}]}})],['outside']);
          assert.deepEqual([...groups({collaborators:[]})],[]);
          console.log('PASS: Wiki current roster, mixed groups, streamer, former-member, and misleading org');
          JS
      - name: Publish tested helper update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Niji_Research_Helper.user.js
          git commit -m 'Use current official Wiki roster to classify collaborator groups (v1.0.24)'
          git push