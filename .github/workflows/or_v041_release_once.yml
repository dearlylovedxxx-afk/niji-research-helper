name: Release OR comment collection v0.4.1
on:
  push:
    paths:
      - .github/workflows/or_v041_release_once.yml
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply guarded OR fix
        run: python .github/scripts/or_v041_detail_workflow_once.py
      - name: Syntax and static regression checks
        run: |
          node --check Niji_OR_Results_Merger.user.js
          git diff --check
          node - <<'JS'
          const fs=require('fs'),assert=require('assert');
          const s=fs.readFileSync('Niji_OR_Results_Merger.user.js','utf8');
          for(const check of ['// @version      0.4.1','async function driveRun()','async function finishRunWord()','async function goRun(url)','const comments=extractComments(main,v.id);','function showResultsViewer()','function showMergedViewer(video)','class:\'nor-comment-line\'','const STORAGE_KEY = \'niji_or_merger_addon_batches_v1\';','const RUN_KEY = \'niji_or_merger_addon_run_v041\';']) assert(s.includes(check),check);
          assert(!s.includes('if(multiJob?.active) void resumeMultiOr();'));
          assert(s.includes('if(runJob?.active) void driveRun();'));
          console.log('PASS: data preservation, native per-video comment collection, light results/detail UI, old auto disabled');
          JS
      - name: Publish tested script
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Niji_OR_Results_Merger.user.js
          git commit -m "Collect actual timestamped comments for OR search (v0.4.1)"
          git push origin HEAD:main
