name: Fix mobile research filters (one time)
on:
  push:
    paths:
      - .github/workflows/nrh-mobile-filter-once.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hide filtered YouTube cards even without GM stylesheet
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Niji_Research_Helper.user.js')
          s = p.read_text(encoding='utf-8')
          old_version = '// @version      1.0.19'
          assert s.count(old_version) == 1 and s.count("const VERSION = '1.0.19';") == 1, 'unexpected version'
          anchor = '  function applyResearchFilters() {'
          assert s.count(anchor) == 1, 'filter anchor not unique'
          s = s.replace(anchor, '  // Restore each card\'s own inline display when its filter is cleared.\n  const researchCardOriginalDisplay = new WeakMap();\n\n' + anchor, 1)
          old = "      e.el.classList.toggle('npf-r-hidden', !show);"
          assert s.count(old) == 1, 'filter visibility line not unique'
          new = '''      // Some mobile Macaque/YouTube pages do not apply GM.addStyle rules.
          // Preserve YouTube's original inline display instead of blindly resetting it.
          if (!show) {
            if (!researchCardOriginalDisplay.has(e.el)) {
              researchCardOriginalDisplay.set(e.el, {
                value: e.el.style.getPropertyValue('display'),
                priority: e.el.style.getPropertyPriority('display'),
              });
            }
            e.el.style.setProperty('display', 'none', 'important');
          } else if (researchCardOriginalDisplay.has(e.el)) {
            const original = researchCardOriginalDisplay.get(e.el);
            if (original.value) e.el.style.setProperty('display', original.value, original.priority);
            else e.el.style.removeProperty('display');
            researchCardOriginalDisplay.delete(e.el);
          }
          e.el.classList.toggle('npf-r-hidden', !show);'''
          s = s.replace(old, new, 1)
          s = s.replace(old_version, '// @version      1.0.20', 1)
          s = s.replace("const VERSION = '1.0.19';", "const VERSION = '1.0.20';", 1)
          p.write_text(s, encoding='utf-8')
          print('Verified single-target mobile visibility patch, v1.0.20')
          PY
          node --check Niji_Research_Helper.user.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Niji_Research_Helper.user.js
          git commit -m 'Fix mobile FPS exclusion hiding v1.0.20'
          git push