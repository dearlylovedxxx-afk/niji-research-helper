name: Release Wiki VC join fix v1.0.31 (one time)
on:
  push:
    paths:
      - .github/workflows/nrh_wiki_join_release_once.yml
permissions:
  contents: write
jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guarded patch and JavaScript syntax check
        run: python .github/scripts/nrh_wiki_join_patch_once.py
      - name: Regression tests for timestamped participant notes
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const assert = require('node:assert/strict');
          const code = fs.readFileSync('Niji_Research_Helper.user.js', 'utf8');
          const match = code.match(/  function wikiExtractJoinPeople\(line = ''\) \{[\s\S]*?\n  \}\n\n  function wikiParsePage/);
          assert.ok(match, 'Wiki join parser exists');
          const context = {wikiCleanPersonName: n => n.trim()};
          vm.runInNewContext(match[0].replace(/\n\n  function wikiParsePage$/, ''), context);
          const cases = [
            ['1:03:10~から葛葉がVC合流、1:28:00~からShu Yamino、2:15:30~から花籠つばさが合流', [{name:'葛葉',at:'1:03:10'},{name:'Shu Yamino',at:'1:28:00'},{name:'花籠つばさ',at:'2:15:30'}]],
            ['2:01:20~から三枝明那が合流', [{name:'三枝明那',at:'2:01:20'}]],
            ['12:30~から配信を視聴', []],
            ['21:00~からインタビューで合流', []],
            ['1:33~からローレン・イロアスがVC合流', [{name:'ローレン・イロアス',at:'1:33'}]]
          ];
          for (const [input, expected] of cases) assert.equal(JSON.stringify(context.wikiExtractJoinPeople(input)), JSON.stringify(expected), input);
          assert.ok(code.includes('info.collaboratorJoinTimes[name] ||= at;'), 'source parser wired');
          assert.ok(code.includes('collaboratorJoinTimes[name] ||= at;'), 'HTML parser wired');
          assert.ok(code.includes('Wiki全件再照合'), 'manual refresh retained');
          assert.ok(code.includes("const NRH_DB_NAME = 'NijiResearchHelperDB';"), 'DB name retained');
          assert.ok(code.includes('const NRH_DB_VERSION = 1;'), 'DB version retained');
          console.log('PASS: 5 parser cases, both Wiki paths, refresh and DB guards');
          JS
          git diff --check
      - name: Publish versioned userscript
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Niji_Research_Helper.user.js
          git diff --cached --exit-code && exit 1 || true
          git commit -m "Fix Wiki timestamped VC joins while preserving research DB (v1.0.31)"
          git push
