name: Release OR resort v0.4.7
on:
  push:
    paths:
      - .github/workflows/or_v047_release_once.yml
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply guarded patch
        run: python .github/scripts/or_v047_sort_once.py
      - name: Syntax and regression checks
        run: |
          node --check Niji_OR_Results_Merger.user.js
          git diff --check
          node <<'JS'
          const fs=require('fs'),assert=require('assert');
          const s=fs.readFileSync('Niji_OR_Results_Merger.user.js','utf8');
          for(const x of ['// @version      0.4.7','const missingBefore=!videoMetadata[v.id] && !metadataStopped;','if(missingBefore && (resultSort===\'newest\'||resultSort===\'oldest\'))','redraw();viewer.scrollTop=previousScroll;','dateLoading','この動画のURLをコピー',"const STORAGE_KEY = 'niji_or_merger_addon_batches_v1';", "const RUN_KEY = 'niji_or_merger_addon_run_v041';"]) assert(s.includes(x),x);
          console.log('PASS delayed date resort, explicit link identity and original storage keys');
          JS
      - name: Publish verified script
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Niji_OR_Results_Merger.user.js
          git commit -m "Resort OR cards when metadata arrives; expose video ID (v0.4.7)"
          git push origin HEAD:main
