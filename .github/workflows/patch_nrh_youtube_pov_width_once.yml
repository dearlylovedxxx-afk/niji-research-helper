name: NRH YouTube POV and panel width one-time patch
on:
  push:
    paths:
      - .github/workflows/patch_nrh_youtube_pov_width_once.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch existing script with exact anchors
        run: python .github/scripts/patch_nrh_youtube_pov_width_once.py
      - name: Verify JavaScript syntax and isolated changes
        run: |
          node --check Niji_Research_Helper.user.js
          git diff --check
          python - <<'PY'
          from pathlib import Path
          s=Path('Niji_Research_Helper.user.js').read_text()
          assert '// @version      1.0.41' in s
          assert 'attachPovSupplement(source, matches, sec, true);' in s
          assert 'installYoutubePanelResize(panel, head, closeBtn);' in s
          assert "const CLOUD_STORES = ['videos','channels','wiki','pairs'];" in s
          assert "const NRH_DB_NAME = 'NijiResearchHelperDB';" in s
          print('PASS: syntax, YouTube complement, desktop resizable panel, DB/cloud invariants')
          PY
      - name: Commit validated update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Niji_Research_Helper.user.js
          git commit -m 'Add YouTube POV supplement and resizable desktop panel v1.0.41'
          git push origin HEAD:main
