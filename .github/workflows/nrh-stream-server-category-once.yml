name: Add streamer-server research category (one time)
on:
  push:
    paths:
      - .github/workflows/nrh-stream-server-category-once.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add independent streamer-server category
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Niji_Research_Helper.user.js')
          s=p.read_text('utf-8')
          def once(old,new):
              global s
              count=s.count(old)
              if count!=1: raise RuntimeError(f'Expected one occurrence, found {count}: {old[:80]!r}')
              s=s.replace(old,new,1)
          once('// @version      1.0.24','// @version      1.0.25')
          once("const VERSION = '1.0.24';", "const VERSION = '1.0.25';")
          once("const RESEARCH_TAGS = ['FPS', 'ソロゲー', 'コラボ', '雑談', '歌'];", "const RESEARCH_TAGS = ['FPS', 'スト鯖', 'ソロゲー', 'コラボ', '雑談', '歌'];")
          anchor="  function researchMentionList(meta) {"
          helper=r'''  // ゲームタイトルではなく、ストリーマー向け共有サーバー企画の分類。
          // GTA/RUST/ARKをプレイしているだけではスト鯖と判定しない。
          function isStreamServerSession(game = '', title = '') {
            const t = normalizeResearchText(title).normalize('NFKC');
            if (/(?:スト(?:鯖|サバ)|ストリーマー(?:専用)?(?:サーバー|鯖)|ストグラ|\bnew\s*town\b|\bmad\s*town\b)/i.test(t)) return true;
            return /\bvcr\b/i.test(t) && /(?:grand theft auto|\bgta\b|\brust\b|\bark\b|minecraft|マイクラ|マインクラフト)/i.test(`${game} ${t}`);
          }

          '''
          once(anchor,helper+anchor)
          once("    if (isFpsGame(game, title)) tags.push('FPS');", "    if (isFpsGame(game, title)) tags.push('FPS');\n    if (isStreamServerSession(game, title)) tags.push('スト鯖');")
          p.write_text(s,'utf-8')
          print('Patched v1.0.25; bytes:',len(s.encode()))
          PY
          node --check Niji_Research_Helper.user.js
      - name: Check classification without confusing game and server
        run: |
          node - <<'JS'
          const fs=require('node:fs'), assert=require('node:assert/strict');
          const s=fs.readFileSync('Niji_Research_Helper.user.js','utf8');
          const m=s.match(/  function isStreamServerSession\(game = '', title = ''\) \{[\s\S]*?\n  \}/);
          assert(m,'server classification function missing');
          const fn=new Function('normalizeResearchText',`${m[0]}\nreturn isStreamServerSession;`)(v=>String(v||'').toLowerCase());
          for (const [game,title] of [['Grand Theft Auto V','【VCR GTA】初日'],['Rust','VCR RUST 参戦'],['Grand Theft Auto V','NEWTOWNの続き'],['Grand Theft Auto V','MADTOWN 最終日'],['Grand Theft Auto V','ストグラへようこそ'],['ARK','スト鯖開始'],['Minecraft','【VCR】マイクラ']]) assert(fn(game,title),`missed server: ${title}`);
          for (const [game,title] of [['Grand Theft Auto V','GTA 通常配信'],['Rust','RUST 初見'],['ARK','ARK ソロ'],["Everybody's Golf",'VCC GOLF'],['VALORANT','VCR VALORANT 大会'],['Grand Theft Auto V','GTA 普通のコラボ']]) assert(!fn(game,title),`false server: ${title}`);
          assert(s.includes("'FPS', 'スト鯖', 'ソロゲー'"));
          assert(s.includes("if (isStreamServerSession(game, title)) tags.push('スト鯖');"));
          console.log('PASS: server event names, normal GTA/RUST/ARK, VCC Golf, and tag UI');
          JS
      - name: Publish tested helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Niji_Research_Helper.user.js
          git commit -m "Add independent streamer-server category without tagging ordinary GTA or RUST"
          git push