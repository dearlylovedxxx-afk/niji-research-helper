name: Release OR result-title timestamp fix v0.4.6
on:
  push:
    paths:
      - .github/workflows/or_v046_release_once.yml
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply guarded patch
        run: python .github/scripts/or_v046_result_links_metadata_once.py
      - name: Syntax and result behavior tests
        run: |
          node --check Niji_OR_Results_Merger.user.js
          git diff --check
          node <<'JS'
          const fs=require('node:fs'),assert=require('node:assert/strict'),vm=require('node:vm');
          const s=fs.readFileSync('Niji_OR_Results_Merger.user.js','utf8');
          const part=(start,end)=>{const a=s.indexOf(start),b=s.indexOf(end,a+start.length);assert(a>=0&&b>a,`missing ${start}`);return s.slice(a,b)};
          assert(s.includes('// @version      0.4.6'));
          assert(s.includes("@namespace    niji-or-results-merger-standalone"));
          assert(s.includes("const STORAGE_KEY = 'niji_or_merger_addon_batches_v1';"));
          assert(s.includes("const RUN_KEY = 'niji_or_merger_addon_run_v041';"));
          assert(s.includes("const MIN_COMMENTS_KEY = 'niji_or_merger_addon_minimum_v1';"));
          assert(s.includes('GM_xmlhttpRequest'));
          assert(s.includes('datePublished'));
          assert(s.includes('配信日時：未取得'));
          assert(s.includes('コメント数が多い順'));
          assert(s.includes('並び順：'));
          assert(s.includes('件のコメントを見る'));
          assert(s.includes('const safeUrl=`https://www.youtube.com/watch?v=${video.id}&t=${Math.max(0,Math.floor(Number(c.sec)||0))}s`;'));
          assert(!s.includes('href:c.url||'));
          const ctx={clip:(v,n=300)=>String(v||'').replace(/\s+/g,' ').trim().slice(0,n),usableVideoTitle:(v)=>String(v||''),console};
          vm.runInNewContext(part('  function isChannelHeading(value=\'\') {','  function titleFromLink(a, card, id) {'),ctx);
          assert(ctx.isChannelHeading('不破湊 / Fuwa Minato 【にじさんじ】'));
          assert(!ctx.validStreamTitle('不破湊 / Fuwa Minato 【にじさんじ】','f8gy0SACV18'));
          assert.equal(ctx.validStreamTitle('【APEX】シルバーウィークDAY1【不破湊/にじさんじ】','f8gy0SACV18'),'【APEX】シルバーウィークDAY1【不破湊/にじさんじ】');
          const html='<html><head><meta property="og:title" content="【APEX】シルバーウィークDAY1【不破湊/にじさんじ】"></head><body>"videoId":"f8gy0SACV18","liveBroadcastDetails":{"startTimestamp":"2026-09-21T05:00:00Z"},"publishDate":"2026-09-21"</body></html>';
          const metaCtx={...ctx,document:{createElement:()=>({innerHTML:'',get value(){return this.innerHTML}})}};
          vm.runInNewContext(part('  function videoMetadataFromHtml(html,id) {','  function fetchYoutubeMetadata(id) {').replace(/^/,'').replace('  function videoMetadataFromHtml','  function videoMetadataFromHtml'),{...metaCtx,decodeMetaText:x=>x,validStreamTitle:ctx.validStreamTitle});
          const m=vm.runInNewContext(`(${part('  function videoMetadataFromHtml(html,id) {','  function fetchYoutubeMetadata(id) {').trim().replace(/^function videoMetadataFromHtml/,'function')});`,{decodeMetaText:x=>x,validStreamTitle:ctx.validStreamTitle});
          assert.equal(m(html,'f8gy0SACV18').publishedAt,'2026-09-21');
          assert.equal(m(html,'f8gy0SACV18').startedAt,'2026-09-21T05:00:00Z');
          assert.deepEqual(JSON.parse(JSON.stringify(m(html,'wrong-video'))),{});
          console.log('PASS OR v0.4.6 title/channel separation, date parse, canonical video timestamp, explicit sort, unchanged data keys');
          JS
      - name: Publish script
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Niji_OR_Results_Merger.user.js
          git commit -m "Fix OR result titles, dates, sort and video-specific timestamps (v0.4.6)"
          git push origin HEAD:main
