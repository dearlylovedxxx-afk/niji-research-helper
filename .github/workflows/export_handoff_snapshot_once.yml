name: Export handoff snapshot once
on:
  push:
    paths:
      - '.github/workflows/export_handoff_snapshot_once.yml'
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build source snapshot
        run: |
          mkdir -p handoff_source
          cp Niji_Research_Helper.user.js handoff_source/
          cp Niji_OR_Results_Merger.user.js handoff_source/
          cp X_Search_Favorites.user.js handoff_source/
          cp Pixiv_Bookmark_Sort.user.js handoff_source/
          cp Niji_Cloud_Backup.user.js handoff_source/
          cp README.md handoff_source/
          mkdir -p handoff_source/cloud-backup
          cp cloud-backup/multi_app_gateway_extension.js handoff_source/cloud-backup/
          printf '%s\n' "Snapshot commit: $GITHUB_SHA" > handoff_source/SNAPSHOT_COMMIT.txt
          zip -r niji-repo-snapshot.zip handoff_source
      - uses: actions/upload-artifact@v4
        with:
          name: niji-repo-snapshot
          path: niji-repo-snapshot.zip
          retention-days: 1
