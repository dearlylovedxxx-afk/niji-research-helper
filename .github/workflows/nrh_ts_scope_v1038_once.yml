name: Release NRH timestamp scope v1.0.38
on:
  push:
    paths:
      - .github/workflows/nrh_ts_scope_v1038_once.yml
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply scope fix
        run: python .github/scripts/nrh_ts_scope_v1038_once.py
      - name: Verify scope and syntax
        run: |
          node --check Niji_Research_Helper.user.js
          git diff --check
          node <<'JS'
          const s=require('fs').readFileSync('Niji_Research_Helper.user.js','utf8');
          const assert=require('assert');
          assert(s.includes('// @version      1.0.38'));
          const fn=s.slice(s.indexOf('  function bindCommentTimestamps()'),s.indexOf('  const EVENT_GROUPS',s.indexOf('  function bindCommentTimestamps()')));
          assert(fn.includes("$$('main .col-md-1 a[href], main .col-2 a[href]')"));
          assert(fn.includes("a.closest('#niji-or-root"));
          assert(!fn.includes("$$('a[href]').forEach"));
          assert(s.includes('NijiResearchHelperDB'));
          console.log('PASS timestamp scoping and preserved DB');
          JS
      - name: Publish verified script
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Niji_Research_Helper.user.js
          git commit -m "Restrict timestamp handler to native comment links (v1.0.38)"
          git push origin HEAD:main
