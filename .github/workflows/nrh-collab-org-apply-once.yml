name: Apply collaborator affiliation filters (one time)
on:
  push:
    paths:
      - .github/workflows/nrh-collab-org-apply-once.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch and check script
        run: |
          python3 .github/scripts/nrh_collab_groups_once.py
          node --check Niji_Research_Helper.user.js
          git diff --check
          node <<'JS'
          const fs=require('fs'),vm=require('vm'),assert=require('assert');
          const src=fs.readFileSync('Niji_Research_Helper.user.js','utf8');
          const a=src.indexOf('  // Affiliation comes from a Holodex');
          const b=src.indexOf('  function paintResearchCollaboratorButton(',a);
          assert(a>0 && b>a);
          const ctx={state:{wikiCache:{'小柳ロウ::2026':{fetchOk:true,channel:'小柳ロウ',entries:{x:{}}}}},research:{collaboratorGroupIncluded:new Set(),collaboratorGroupExcluded:new Set()},normalizeCollaboratorName:x=>String(x||'').split('/')[0].trim().replace(/\s/g,''),$$:()=>[],isMobileYoutubeUi:()=>false,updateResearchCollaboratorFilterUi:()=>{},applyResearchFilters:()=>{}};
          vm.createContext(ctx);
          vm.runInContext(src.slice(a,b),ctx);
          const groups=vm.runInContext('researchCollaboratorOrgGroups',ctx);
          const both=groups({meta:{mentions:[{name:'小柳ロウ',org:'Nijisanji'},{name:'渋谷ハル',org:'Indie'}]}});
          assert(both.has('nijisanji') && both.has('outside'));
          assert(groups({collaborators:['小柳ロウ']}).has('nijisanji'));
          assert.strictEqual(groups({meta:{mentions:[{name:'所属不明',org:null}]}}).size,0);
          const cycle=vm.runInContext('cycleResearchCollaboratorGroup',ctx);
          cycle('outside');assert(ctx.research.collaboratorGroupIncluded.has('outside'));
          cycle('outside');assert(ctx.research.collaboratorGroupExcluded.has('outside'));
          cycle('outside');assert(!ctx.research.collaboratorGroupExcluded.has('outside'));
          console.log('Affiliation group smoke tests: PASS');
          JS
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Niji_Research_Helper.user.js
          git commit -m 'Add Nijisanji and external collaborator filters (v1.0.23)'
          git push