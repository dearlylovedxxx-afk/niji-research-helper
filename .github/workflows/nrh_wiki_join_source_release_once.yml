name: Repair current-year Wiki join extraction v1.0.36 (one time)
on:
  push:
    paths:
      - .github/workflows/nrh_wiki_join_source_release_once.yml
permissions:
  contents: write
jobs:
  patch-test-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guarded fix for current-year Wiki source parsing
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('Niji_Research_Helper.user.js')
          s = p.read_text(encoding='utf-8')
          assert '// @version      1.0.35' in s and "const VERSION = '1.0.35';" in s, 'Unexpected version; stop'
          for marker in ("// @namespace    niji-pov-helper", "const NRH_DB_NAME = 'NijiResearchHelperDB';", 'const NRH_DB_VERSION = 1;', "const KEY_WIKI_CACHE = 'npf_wiki_cache_v11';", 'function wikiExtractJoinPeople(', "...mount.querySelectorAll(':scope > .npf-research-meta')"):
              assert marker in s, f'Missing compatibility or deduplication marker: {marker}'
          old_fn = "async function wikiParseUrlWithSource(pageUrl, renderedHtml = '')"
          # Match the actual default argument spelling exactly.
          old_fn = "async function wikiParseUrlWithSource(pageUrl, renderedHtml = '')"
          if old_fn not in s:
              old_fn = "async function wikiParseUrlWithSource(pageUrl = '', renderedHtml = '')"
          assert s.count(old_fn) == 1, 'Parser signature changed'
          s = s.replace(old_fn, old_fn[:-1] + ', requireSource = false)', 1)
          old_skip = "if (Object.keys(entries).length >= 20 && Object.values(entries).some(info => (info.collaborators || []).length)) return entries;"
          assert s.count(old_skip) == 1, 'Source short-circuit changed'
          s = s.replace(old_skip, "if (!requireSource && Object.keys(entries).length >= 20 && Object.values(entries).some(info => (info.collaborators || []).length)) return entries;", 1)
          old_year = 'const entries = await wikiParseUrlWithSource(url, html);'
          assert s.count(old_year) == 1, 'Year page call changed'
          s = s.replace(old_year, 'const entries = await wikiParseUrlWithSource(url, html, Number(year) === new Date().getFullYear());', 1)
          old_discovered = 'const entries = await wikiParseUrlWithSource(url, await wikiRequest(url));'
          assert s.count(old_discovered) == 1, 'Discovered year page call changed'
          s = s.replace(old_discovered, 'const entries = await wikiParseUrlWithSource(url, await wikiRequest(url), Number(year) === new Date().getFullYear());', 1)
          s = s.replace('// @version      1.0.35', '// @version      1.0.36', 1)
          s = s.replace("const VERSION = '1.0.35';", "const VERSION = '1.0.36';", 1)
          p.write_text(s, encoding='utf-8')
          print('PASS: guarded current-year Wiki source parsing; preserved DB identity and desktop badge deduplication')
          PY
          node --check Niji_Research_Helper.user.js
          git diff --check
      - name: Regression test source merge and unchanged historical fast path
        run: |
          node <<'JS'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const code = fs.readFileSync('Niji_Research_Helper.user.js', 'utf8');
          const start = code.indexOf('  async function wikiParseUrlWithSource(');
          const end = code.indexOf('  function wikiSanitizeChannelName(', start);
          assert(start > 0 && end > start, 'Expected parser function not found');
          const base = Object.fromEntries(Array.from({length:25},(_,i) => [`id${i}`,{collaborators:i===0?['既存参加者']:[]}]));
          let requests = 0;
          const parser = new Function('wikiParsePage','wikiExtractSourceText','wikiParseSourceText','wikiMergeEntries','wikiSourceCommandUrls','wikiRequest','console',code.slice(start,end)+'; return wikiParseUrlWithSource;')(
            () => structuredClone(base), () => 'wiki source', () => ({id9:{collaborators:['途中合流者']}}),
            (a,b) => {const merged=structuredClone(a); for(const [id,v] of Object.entries(b)){merged[id]={...(merged[id]||{}),collaborators:[...new Set([...(merged[id]?.collaborators||[]),...(v.collaborators||[])])]}} return merged;},
            () => ['https://wikiwiki.jp/nijisanji/::cmd/source?page=2026'], async () => {requests++;return '<textarea>wiki source</textarea>';}, console
          );
          (async()=>{
            const fast = await parser('https://wikiwiki.jp/nijisanji/test/動画一覧/2025','',false);
            assert.equal(requests,0, 'Historical fast path must not add source requests');
            assert.equal(fast.id0.collaborators[0],'既存参加者');
            const fresh = await parser('https://wikiwiki.jp/nijisanji/test/動画一覧/2026','',true);
            assert.equal(requests,1, 'Current-year page should try source once despite another video having a collaborator');
            assert.deepEqual(fresh.id9.collaborators,['途中合流者']);
            assert.deepEqual(fresh.id0.collaborators,['既存参加者']);
            assert(code.includes('wikiParseUrlWithSource(url, html, Number(year) === new Date().getFullYear())'));
            assert(code.includes("const NRH_DB_NAME = 'NijiResearchHelperDB';"));
            assert(code.includes("const KEY_WIKI_CACHE = 'npf_wiki_cache_v11';"));
            assert(code.includes("...mount.querySelectorAll(':scope > .npf-research-meta')"));
            console.log('PASS: current-year join merge, prior collaborator retention, historical fast path, DB identity, badge dedupe');
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
      - name: Publish tested script
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Niji_Research_Helper.user.js
          git commit -m 'Recover current-year Wiki VC join participants across devices (v1.0.36)'
          git push origin HEAD:main
