name: Release full-width desktop research rows v1.0.34 (one time)
on:
  push:
    paths:
      - .github/workflows/nrh_desktop_fullwidth_release_once.yml
permissions:
  contents: write
jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply guarded layout repair and test it
        run: |
          python .github/scripts/nrh_desktop_fullwidth_patch_once.py
      - name: Publish tested userscript
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Niji_Research_Helper.user.js
          git commit -m "Place desktop titles and research tags in separate rows (v1.0.34)"
          git push origin HEAD:main