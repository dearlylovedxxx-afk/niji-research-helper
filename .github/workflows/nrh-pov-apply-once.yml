name: Verify and publish POV filtering (one time)
on:
  push:
    paths:
      - .github/workflows/nrh-pov-apply-once.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch v1.0.27 without altering the DB or separate addon
        run: |
          python3 - <<'PY'
          import base64, zlib
          payload=''
          exec(zlib.decompress(base64.b64decode(payload)).decode('utf-8'))
          PY
          node --check Niji_Research_Helper.user.js
      - name: Test strict POV matching and member filter
        run: |
          node - <<'JS'
          const fs=require('fs'),assert=require('assert');
          const s=fs.readFileSync('Niji_Research_Helper.user.js','utf8');
          assert(s.includes('// @version      1.0.28'));
          assert(s.includes('povAttachFilter(area, povOrgFilter, mode => renderMatches'));
          assert(s.includes('povAttachFilter(area, povOrgFilter, mode => renderYoutubeMatches'));
          const a=s.indexOf('  function relationInfo('),b=s.indexOf('  function updateInlineButtonLabels(',a);
          assert(a>0&&b>a);
          const rel=new Function('channelId','mentionIds','researchGameFromText','normalizeResearchText','sharedHashtags','tokenize',s.slice(a,b)+'return relationInfo;')(
            v=>v.channel?.id||'',v=>new Set((v.mentions||[]).map(x=>x.id||x.channel?.id).filter(Boolean)),
            (title,topic)=>topic||(/RUST/i.test(title)?'Rust':/VALORANT/i.test(title)?'Valorant':'APEX'),
            x=>String(x).toLowerCase(),()=>[],t=>new Set(t.toLowerCase().split(/[^\p{L}\p{N}]+/u).filter(Boolean)));
          const src={channel:{id:'A'},title:'【APEX】通常ランク',topic_id:'APEX',mentions:[]};
          const sameTime={channel:{id:'B'},title:'【APEX】通常ランク',topic_id:'APEX',mentions:[]};
          assert.strictEqual(rel(src,sameTime,1,false).related,false,'same title and game must not imply a POV');
          assert.strictEqual(rel(src,{...sameTime,title:'【APEX】別のイベント'},1,true).related,false,'broad event must not imply a POV');
          assert.strictEqual(rel(src,{...sameTime,mentions:[{id:'A'}]},0,false).related,true,'direct participant mention is supported');
          assert.strictEqual(rel(src,{...sameTime,title:'【VALORANT】別配信',topic_id:'VALORANT',mentions:[{id:'A'}]},0,false).related,false,'different games rejected');
          const p=s.indexOf('  function povChannelGroup('),q=s.indexOf('  function renderMatches(',p);
          assert(p>0&&q>p);
          const roster={ready:true,names:new Set(['小柳ロウ','叶'])};
          const member=new Function('researchRoster','researchRosterKey',s.slice(p,q)+'return povChannelGroup;')(roster,x=>String(x||'').trim());
          assert.strictEqual(member({channel:{name:'叶'}}),'nijisanji');
          assert.strictEqual(member({channel:{name:'ととみっくす'}}),'outside');
          assert.strictEqual(member({channel:{name:'Unknown Alias',org:'Nijisanji'}}),'unknown');
          console.log('PASS: both POV UIs, false-positive examples, direct mentions, Wiki-roster membership');
          JS
      - name: Publish only after tests pass
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Niji_Research_Helper.user.js
          git commit -m 'Filter POV results by current Nijisanji roster and tighten relevance (v1.0.28)'
          git push origin HEAD:main