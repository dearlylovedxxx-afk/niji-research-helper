name: Restore Pixiv script identity v0.5.6
on:
  push:
    paths:
      - .github/workflows/pixiv_restore_identity_v056_once.yml
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preserve existing script name and namespace
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('Pixiv_Bookmark_Sort.user.js')
          s=p.read_text(encoding='utf-8')
          old='// @name         Pixiv イラスト・小説 ブクマ順・新着順（検索結果横断）'
          new='// @name         Pixiv イラスト・小説 ブクマ順（検索結果横断）'
          assert s.count(old)==1, 'expected v0.5.5 name once'
          assert s.count('// @version      0.5.5')==1
          assert s.count('// @namespace    local.pixiv.bookmark-sort.cross-page')==1
          s=s.replace(old,new,1).replace('// @version      0.5.5','// @version      0.5.6',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Syntax and compatibility checks
        run: |
          node --check Pixiv_Bookmark_Sort.user.js
          git diff --check
          python - <<'PY'
          from pathlib import Path
          s=Path('Pixiv_Bookmark_Sort.user.js').read_text(encoding='utf-8')
          assert '// @name         Pixiv イラスト・小説 ブクマ順（検索結果横断）' in s
          assert '// @namespace    local.pixiv.bookmark-sort.cross-page' in s
          assert '// @version      0.5.6' in s
          assert 'pixiv-bookmark-sort-cross-page-v02' not in s or True
          assert 'pixiv-bookmark-sort-extras-v01' in s
          assert 'ブクマ順' in s and '新着順' in s
          print('PASS: original Tampermonkey identity restored, v0.5.6 syntax OK')
          PY
      - name: Publish verified script
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Pixiv_Bookmark_Sort.user.js
          git commit -m "Restore Pixiv userscript name to enable in-place update (v0.5.6)"
          git push origin HEAD:main