name: Add collaborator affiliation filters (one time)
on:
  push:
    paths:
      - .github/workflows/nrh-collaborator-org-filter-once.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Implement safe affiliation include and exclude filters
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Niji_Research_Helper.user.js')
          s=p.read_text(encoding='utf-8')
          def replace(old,new,expected=1):
              global s
              n=s.count(old)
              if n!=expected: raise RuntimeError(f'Expected {expected} matches, found {n}: {old[:100]!r}')
              s=s.replace(old,new)
          replace('// @version      1.0.22','// @version      1.0.23')
          replace("const VERSION = '1.0.22';", "const VERSION = '1.0.23';")
          replace('    collaboratorExcluded: new Map(), // normalized person -> display name; exclusions always win\n', '''    collaboratorExcluded: new Map(), // normalized person -> display name; exclusions always win
    collaboratorGroupIncluded: new Set(), // nijisanji / outside, OR with individual includes
    collaboratorGroupExcluded: new Set(), // independently exclude both groups
''')
          needle='  function paintResearchCollaboratorButton(btn, name, isCard = false) {'
          helper='''  // Affiliation comes from Holodex mention org or a successfully parsed Nijisanji Wiki
  // channel page. Never assume that a missing org means someone is outside Nijisanji.
  const RESEARCH_COLLAB_GROUPS = { nijisanji:'にじさんじ', outside:'にじさんじ以外' };

  function researchKnownNijisanjiNames() {
    const known = new Set();
    for (const [cacheKey, dataset] of Object.entries(state.wikiCache || {})) {
      if (!dataset?.fetchOk || !Object.keys(dataset.entries || {}).length) continue;
      const name = dataset.channel || cacheKey.replace(/^history::/, '').split('::')[0];
      const key = normalizeCollaboratorName(name);
      if (key) known.add(key);
    }
    return known;
  }

  function researchCollaboratorOrgGroups(entry) {
    const groups = new Set();
    const known = researchKnownNijisanjiNames();
    const mentions = Array.isArray(entry?.meta?.mentions) ? entry.meta.mentions : [];
    for (const mention of mentions) {
      const channel = mention?.channel || mention || {};
      const names = [mention?.name, mention?.english_name, channel.name, channel.english_name]
        .map(normalizeCollaboratorName).filter(Boolean);
      if (names.some(name => known.has(name))) { groups.add('nijisanji'); continue; }
      const rawOrg = mention?.org ?? channel.org;
      const org = typeof rawOrg === 'string' ? rawOrg.trim() : '';
      if (/nijisanji|にじさんじ/i.test(org)) groups.add('nijisanji');
      else if (org) groups.add('outside');
    }
    // Wiki-only collaborator names are identifiable when their OWN channel has a
    // previously confirmed entry in the Nijisanji Wiki cache. Others remain unknown.
    for (const name of [...(entry?.collaborators || []), ...(entry?.wikiInfo?.collaborators || [])]) {
      if (known.has(normalizeCollaboratorName(name))) groups.add('nijisanji');
    }
    for (const group of (entry?.collaboratorOrgGroups || [])) {
      if (Object.prototype.hasOwnProperty.call(RESEARCH_COLLAB_GROUPS, group)) groups.add(group);
    }
    return groups;
  }

  function researchGroupFilterPass(groups) {
    if ([...research.collaboratorGroupExcluded].some(group => groups.has(group))) return false;
    return !research.collaboratorGroupIncluded.size ||
      [...research.collaboratorGroupIncluded].some(group => groups.has(group));
  }

  function updateResearchCollaboratorGroupButtons() {
    $$('.npf-r-collab-group').forEach(btn => {
      const group = btn.dataset.collabGroup;
      const included = research.collaboratorGroupIncluded.has(group);
      const excluded = research.collaboratorGroupExcluded.has(group);
      btn.classList.toggle('active', included);
      btn.classList.toggle('excluded', excluded);
      btn.textContent = `${excluded ? '−' : included ? '✓' : '🤝'} ${RESEARCH_COLLAB_GROUPS[group]}`;
      btn.setAttribute('aria-pressed', included || excluded ? 'true' : 'false');
      if (isMobileYoutubeUi()) {
        if (included || excluded) {
          btn.style.setProperty('background', excluded ? '#803746' : '#5147a6', 'important');
          btn.style.setProperty('color', '#fff', 'important');
          btn.style.setProperty('border-color', excluded ? '#e58c96' : '#8172ea', 'important');
        } else {
          btn.style.removeProperty('background');
          btn.style.removeProperty('color');
          btn.style.removeProperty('border-color');
        }
      }
    });
  }

  function cycleResearchCollaboratorGroup(group) {
    if (!Object.prototype.hasOwnProperty.call(RESEARCH_COLLAB_GROUPS, group)) return;
    if (research.collaboratorGroupIncluded.has(group)) {
      research.collaboratorGroupIncluded.delete(group);
      research.collaboratorGroupExcluded.add(group);
    } else if (research.collaboratorGroupExcluded.has(group)) {
      research.collaboratorGroupExcluded.delete(group);
    } else {
      research.collaboratorGroupIncluded.add(group);
    }
    updateResearchCollaboratorFilterUi();
    applyResearchFilters();
  }

'''
          replace(needle,helper+needle)
          replace("    const excludedPerson = [...research.collaboratorExcluded.keys()].some(key => people.has(key));\n    // The history loader already selects the focused collaborator; some wiki rows\n    // list only the OTHER guests, so do not re-test inclusion here.\n    return tagOk && includeOk && excludeOk && !excludedPerson;", "    const excludedPerson = [...research.collaboratorExcluded.keys()].some(key => people.has(key));\n    const live = currentResearchEntries().find(entry => entry.id === row.id);\n    const groups = researchCollaboratorOrgGroups(live || row);\n    // The history loader already selects the focused collaborator; some wiki rows\n    // list only the OTHER guests, so do not re-test individual names here.\n    return tagOk && includeOk && excludeOk && !excludedPerson && researchGroupFilterPass(groups);")
          replace("    const collaborators = [...mentions];\n    if (person && !collaborators.some(n => normalizeCollaboratorName(n) === normalizeCollaboratorName(person))) {", "    const collaborators = [...mentions];\n    const collaboratorOrgGroups = [...researchCollaboratorOrgGroups({ meta:v, collaborators })];\n    if (person && !collaborators.some(n => normalizeCollaboratorName(n) === normalizeCollaboratorName(person))) {")
          replace("      collaborators,\n      notes: [],\n      sourceUrl: '',\n      source: 'Holodex',", "      collaborators, collaboratorOrgGroups,\n      notes: [],\n      sourceUrl: '',\n      source: 'Holodex',")
          replace("    updateResearchCollaboratorSuggestions();\n  }\n\n  // Full-period Wiki/Holodex history is fetched", "    updateResearchCollaboratorSuggestions();\n    updateResearchCollaboratorGroupButtons();\n  }\n\n  // Full-period Wiki/Holodex history is fetched")
          replace("      const personExcluded = [...research.collaboratorExcluded.keys()].some(key => people.has(key));\n      const personIncluded = !research.collaboratorIncluded.size ||\n        [...research.collaboratorIncluded.keys()].some(key => people.has(key)) ||\n        (!!collaboratorKey && research.collaboratorIncluded.has(collaboratorKey) && historyMatchIds.has(e.id));\n      const show = tagOk && includeOk && excludeOk && !personExcluded && personIncluded;", "      const personExcluded = [...research.collaboratorExcluded.keys()].some(key => people.has(key));\n      const groups = researchCollaboratorOrgGroups(e);\n      const groupExcluded = [...research.collaboratorGroupExcluded].some(group => groups.has(group));\n      const personIncluded = !research.collaboratorIncluded.size && !research.collaboratorGroupIncluded.size ||\n        [...research.collaboratorIncluded.keys()].some(key => people.has(key)) ||\n        (!!collaboratorKey && research.collaboratorIncluded.has(collaboratorKey) && historyMatchIds.has(e.id)) ||\n        [...research.collaboratorGroupIncluded].some(group => groups.has(group));\n      const show = tagOk && includeOk && excludeOk && !personExcluded && !groupExcluded && personIncluded;")
          replace("    collabSelected.hidden = true;\n    collabControl.append(collabLabel, collabHint, collabRow, collabExclude, collabOptions, collabSuggestions, collabSelected);", """    collabSelected.hidden = true;
    const groupLabel = document.createElement('div');
    groupLabel.className = 'npf-r-label';
    groupLabel.textContent = 'コラボ相手の所属で絞り込み';
    const groupHint = document.createElement('div');
    groupHint.className = 'npf-r-filter-hint';
    groupHint.textContent = 'タップ：紫 ✓ 絞り込み → 赤 − 除外 → 未選択。箱内・箱外の両方がいる動画は両方に該当、除外が優先。Holodex等で所属不明の相手は勝手に箱外扱いしません。';
    const groupButtons = document.createElement('div');
    groupButtons.className = 'npf-r-collab-suggestions';
    for (const [group, label] of Object.entries(RESEARCH_COLLAB_GROUPS)) {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'npf-r-collab-quick npf-r-collab-group';
      b.dataset.collabGroup = group;
      b.textContent = `🤝 ${label}`;
      b.addEventListener('click', () => cycleResearchCollaboratorGroup(group));
      groupButtons.appendChild(b);
    }
    collabControl.append(collabLabel, collabHint, collabRow, collabExclude, collabOptions, collabSuggestions, collabSelected, groupLabel, groupHint, groupButtons);""")
          replace("      research.collaboratorIncluded.clear(); research.collaboratorExcluded.clear();", "      research.collaboratorIncluded.clear(); research.collaboratorExcluded.clear();\n      research.collaboratorGroupIncluded.clear(); research.collaboratorGroupExcluded.clear();")
          replace("    if (research.collaboratorIncluded.size || research.collaboratorExcluded.size || research.collabHistoryLoading) {", "    if (research.collaboratorIncluded.size || research.collaboratorExcluded.size || research.collaboratorGroupIncluded.size || research.collaboratorGroupExcluded.size || research.collabHistoryLoading) {")
          replace("      const hist = research.collaboratorFilter ?", "      const groups = [...research.collaboratorGroupIncluded].map(g => RESEARCH_COLLAB_GROUPS[g]).join('・');\n      const excludedGroups = [...research.collaboratorGroupExcluded].map(g => RESEARCH_COLLAB_GROUPS[g]).join('・');\n      const hist = research.collaboratorFilter ?")
          replace("[included, excluded, hist].filter(Boolean).join(' ・ ')", "[included, excluded, groups ? `所属 ${groups}` : '', excludedGroups ? `所属除外 ${excludedGroups}` : '', hist].filter(Boolean).join(' ・ ')")
          p.write_text(s,encoding='utf-8')
          print('Patched affiliation controls and filters')
          PY
          node --check Niji_Research_Helper.user.js
          git diff --check
          node <<'JS'
          const fs=require('fs'), vm=require('vm'),assert=require('assert');
          const code=fs.readFileSync('Niji_Research_Helper.user.js','utf8');
          const start=code.indexOf('  // Affiliation comes from Holodex');
          const end=code.indexOf('  function paintResearchCollaboratorButton(',start);
          assert(start>0 && end>start);
          const context={state:{wikiCache:{'小柳ロウ::2026':{fetchOk:true,channel:'小柳ロウ',entries:{id:{}}}}},
            research:{collaboratorGroupIncluded:new Set(),collaboratorGroupExcluded:new Set()},
            normalizeCollaboratorName:name=>String(name||'').split('/')[0].trim().replace(/\s/g,''),
            $$:()=>[],isMobileYoutubeUi:()=>false,updateResearchCollaboratorFilterUi:()=>{},applyResearchFilters:()=>{}};
          vm.createContext(context);
          vm.runInContext(code.slice(start,end),context);
          const groups=entry=>new Set(vm.runInContext('researchCollaboratorOrgGroups',context)(entry));
          assert(groups({meta:{mentions:[{name:'小柳ロウ',org:'Nijisanji'},{name:'渋谷ハル',org:'Indie'}]}}).has('outside'));
          assert(groups({meta:{mentions:[{name:'小柳ロウ',org:'Nijisanji'},{name:'渋谷ハル',org:'Indie'}]}}).has('nijisanji'));
          assert(groups({collaborators:['小柳ロウ']}).has('nijisanji'));
          assert.strictEqual(groups({meta:{mentions:[{name:'所属不明',org:null}]}}).size,0);
          const cycle=vm.runInContext('cycleResearchCollaboratorGroup',context);
          cycle('outside'); assert(context.research.collaboratorGroupIncluded.has('outside'));
          cycle('outside'); assert(context.research.collaboratorGroupExcluded.has('outside'));
          cycle('outside'); assert(!context.research.collaboratorGroupExcluded.has('outside'));
          console.log('Affiliation classification and three-state buttons: OK');
          JS
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Niji_Research_Helper.user.js
          git commit -m 'Add Nijisanji and external collaborator filters (v1.0.23)'
          git push