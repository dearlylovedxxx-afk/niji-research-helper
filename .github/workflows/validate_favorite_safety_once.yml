name: Validate favorite safety once
on:
  push:
    paths:
      - '.github/workflows/validate_favorite_safety_once.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate syntax and safety guards
        run: |
          node --check Niji_Research_Helper.user.js
          grep -q "// @version      1.0.49" Niji_Research_Helper.user.js
          grep -q "npf_favorites_shadow_v1" Niji_Research_Helper.user.js
          grep -q "loadFavoritesSafely" Niji_Research_Helper.user.js
          grep -q "assertFavoriteStorageReadable" Niji_Research_Helper.user.js
