name: Install guarded OR cloud bridge once
on:
  push:
    paths:
      - '.github/workflows/or_cloud_bridge_once.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Patch original OR userscript without touching storage
        run: python3 .github/scripts/add_or_backup_bridge_once.py
      - name: Validate JavaScript and backup bridge
        run: |
          node --check Niji_OR_Results_Merger.user.js
          python3 - <<'PY'
          from pathlib import Path
          s=Path('Niji_OR_Results_Merger.user.js').read_text()
          for t in ('ncb-or-request-v1','ncb-or-response-v1','CLOUD_OR_KEYS','0.4.9','niji_or_merger_addon_batches_v1'):
            assert t in s,t
          assert s.count('ncb-or-request-v1') == 1
          print('OR backup bridge syntax and regression checks passed')
          PY
      - name: Commit updated script
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Niji_OR_Results_Merger.user.js
          git commit -m 'Add non-destructive backup bridge to OR v0.4.9'
          git push