name: Validate liver favorites cloud once
on:
  push:
    paths:
      - '.github/workflows/validate_liver_favorites_cloud_once.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate
        run: |
          node --check Niji_Research_Helper.user.js
          grep -q "// @version      1.0.54" Niji_Research_Helper.user.js
          grep -q "favoriteBundleVersion:2" Niji_Research_Helper.user.js
          grep -q "persistLiverFavorites" Niji_Research_Helper.user.js
          grep -q "recoverLiverFavoritesFromExistingPCloud" Niji_Research_Helper.user.js
          git diff --check
