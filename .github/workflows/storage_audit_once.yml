name: Storage coverage audit (one-time)
on:
  push:
    paths:
      - .github/workflows/storage_audit_once.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enumerate userscript storage and POV persistence
        run: |
          python - <<'PY'
          import re,subprocess
          from pathlib import Path
          scripts=['Niji_Research_Helper.user.js','Niji_OR_Results_Merger.user.js','X_Search_Favorites.user.js','Pixiv_Bookmark_Sort.user.js']
          patterns=[r'localStorage\.(?:setItem|getItem|removeItem)',r'sessionStorage\.(?:setItem|getItem|removeItem)',r'GM\.(?:setValue|getValue)',r'indexedDB\.open',r'\b(?:localforage|Caches|CacheStorage)\b',r'\b(?:cloudSnapshot|cloudBackup|cloudRestore)\b']
          print('===== STORAGE CALLS =====')
          for fn in scripts:
            lines=Path(fn).read_text().splitlines()
            print('\nSCRIPT',fn,'LINES',len(lines))
            for i,line in enumerate(lines,1):
              if any(re.search(p,line) for p in patterns):print(f'{i:5}: {line.strip()[:210]}')
          print('\n===== OTHER POV STATE =====')
          lines=Path(scripts[0]).read_text().splitlines()
          for i,line in enumerate(lines,1):
            if re.search(r'other.?pov|pov.?cache|other.?view|他視点|他の視点|\bpairs\b',line,re.I):
              if any(w in line for w in ['getValue','setValue','Storage','Db','DB','cache','Cache','pairs','他視点','他の視点']):
                print(f'{i:5}: {line.strip()[:230]}')
          print('\n===== PIXIV PINNED BASE STORAGE =====')
          base=subprocess.run(['git','show','9eb97e51cedba0d081db3cc7331ecc8c01ea6685:Pixiv_Bookmark_Sort.user.js'],capture_output=True,text=True,check=True).stdout.splitlines()
          for i,line in enumerate(base,1):
            if re.search(r'localStorage\.|sessionStorage\.|indexedDB\.open|createObjectStore|GM\.',line):print(f'{i:5}: {line.strip()[:210]}')
          PY