name: Verify tournament classification and streamer filter (one time)
on:
  push:
    paths:
      - .github/workflows/nrh-tournament-apply-once.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch helper and check syntax
        run: |
          python3 .github/scripts/nrh_tournament_patch_once.py
          node --check Niji_Research_Helper.user.js
      - name: Test categories and avoid false positives
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const src = fs.readFileSync('Niji_Research_Helper.user.js', 'utf8');
          const begin = src.indexOf('  function isFpsGame(');
          const end = src.indexOf('  function researchDurationSeconds(', begin);
          assert(begin > 0 && end > begin, 'classification code anchors');
          const norm = value => String(value || '').toLowerCase().replace(/[\s　]+/g, ' ').trim();
          const {researchCategories, isStreamServerSession, isTournamentRelated} =
            new Function('normalizeResearchText', src.slice(begin, end) +
              'return {researchCategories,isStreamServerSession,isTournamentRelated}')(norm);
          const has = (title, game, tag) => researchCategories(title, null, game).includes(tag);
          for (const title of ['【VCR Rust】 最終日 海賊団', '[VCR Rust] 布ドラ缶よじごんじ',
                               '【NEW TOWN】バトロワ', '【ストグラ】出勤']) {
            assert(has(title, title.includes('Rust') ? 'Rust' : 'Grand Theft Auto V', 'スト鯖'), title);
          }
          for (const title of ['【大会】本戦', '【V最協】顔合わせ', '【CRカップ】練習',
                               '【APEX】スクリム3日目', '【VALORANT】SCRIM 振り返り',
                               '【にじ甲】ドラフト', '【マリカにじさんじ杯】予選', '【VCC】チーム練習']) {
            assert(has(title, 'APEX Legends', '大会'), title);
          }
          for (const title of ['【VALORANT】ランク', '【Rust】普通のソロゲーム',
                               '【GTA】ストーリーミッション', '【Minecraft】建築練習']) {
            assert(!has(title, '', 'スト鯖') && !has(title, '', '大会'), title);
          }
          assert(!isStreamServerSession('Rust', '【Rust】普通のゲーム'));
          assert(!isTournamentRelated('【VALORANT】ランク'));
          assert(src.includes("const categoryTitle = [entry.title, meta?.title, wiki?.wikiTitle].filter(Boolean).join(' ');"));
          assert(src.includes("const RESEARCH_TAGS = ['FPS', 'スト鯖', '大会', 'ソロゲー', 'コラボ', '雑談', '歌'];"));
          console.log('PASS streamer-server examples; tournament, scrim and related practice; non-event controls');
          JS
      - name: Publish tested helper update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Niji_Research_Helper.user.js
          git commit -m 'Add tournament category and strengthen streamer metadata matching (v1.0.27)'
          git push origin HEAD:main
