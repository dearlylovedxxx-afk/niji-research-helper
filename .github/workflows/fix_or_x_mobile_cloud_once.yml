name: Fix OR cloud injection and X mobile controls once
on:
  push:
    paths:
      - .github/workflows/fix_or_x_mobile_cloud_once.yml
permissions:
  contents: write
jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply guarded updates
        run: python3 .github/scripts/fix_or_x_mobile_cloud_once.py
      - name: Syntax and invariant checks
        run: |
          node --check Niji_OR_Results_Merger.user.js
          node --check X_Search_Favorites.user.js
          node --check Niji_Cloud_Backup.user.js
          python3 - <<'PY'
          from pathlib import Path
          o=Path('Niji_OR_Results_Merger.user.js').read_text()
          x=Path('X_Search_Favorites.user.js').read_text()
          assert 'NCB_OR_EMBEDDED_BEGIN' in o and '@require      https://raw.githubusercontent.com/dearlylovedxxx-afk/niji-research-helper/main/Niji_Cloud_Backup.user.js' not in o
          assert "const VERSION = '0.4.11';" in o
          assert "KEY='xsf_userscript_v1'" in x and 'bottom:calc(155px + env(safe-area-inset-bottom, 0px))' in x
          print('PASS: JS syntax, OR standalone cloud, X data-preserving mobile layout')
          PY
          git diff --check
      - name: Publish scripts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Niji_OR_Results_Merger.user.js X_Search_Favorites.user.js
          git commit -m 'Bundle OR cloud backup and raise X controls on mobile'
          git push origin HEAD:main
