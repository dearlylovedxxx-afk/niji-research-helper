name: Retry collaborator filter fix (one time)
on:
  push:
    paths:
      - .github/workflows/nrh-collab-retry-once.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply and verify collaborator filter update
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object Niji_Research_Helper.user.js)" = "e07205ccf07981ccb242a21c00c294ed36a6fd20"
          python3 - <<'PY'
          import base64, zlib, re
          from pathlib import Path
          workflow = Path('.github/workflows/nrh-collab-three-state-once.yml').read_text(encoding='utf-8')
          payload = re.search(r"payload = '([A-Za-z0-9+/=]+)'", workflow)
          assert payload, 'Patch payload missing'
          script = zlib.decompress(base64.b64decode(payload.group(1))).decode('utf-8')
          import sys
          sys.argv = ['patch.py', 'Niji_Research_Helper.user.js']
          exec(compile(script, 'patch.py', 'exec'), {'__name__': '__main__'})
          PY
          node --check Niji_Research_Helper.user.js
          python3 - <<'PY'
          from pathlib import Path
          text = Path('Niji_Research_Helper.user.js').read_text(encoding='utf-8')
          assert '// @version      1.0.21' in text
          assert text.count('const researchCardOriginalDisplay = new WeakMap();') == 1
          assert 'research.collaboratorExcluded.clear();' in text
          assert 'function cycleResearchCollaborator(' in text
          assert 'const show = tagOk && includeOk && excludeOk && !personExcluded && personIncluded;' in text
          assert "const CLOUD_URL = 'https://niji-research-backup.dearlylovedxxx.workers.dev';" in text
          print('PASS: syntax, multi-person filters, safe reset and backup endpoint')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Niji_Research_Helper.user.js
          git commit -m 'Add multi-person collaborator include and exclude (v1.0.21)'
          git push