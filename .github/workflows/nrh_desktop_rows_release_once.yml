name: Fix desktop title and badge rows v1.0.33 (one time)
on:
  push:
    paths:
      - .github/workflows/nrh_desktop_rows_release_once.yml
permissions:
  contents: write
jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Guarded patch and JavaScript syntax check
        run: python .github/scripts/nrh_desktop_rows_patch_once.py
      - name: Verify desktop placement and mobile fallback
        run: |
          node - <<'JS'
          const fs=require('fs'), assert=require('assert');
          const text=fs.readFileSync('Niji_Research_Helper.user.js','utf8');
          const begin=text.indexOf('  function researchMount(card, titleEl) {');
          const end=text.indexOf('\n\n  const META_MAX_ATTEMPTS',begin);
          assert(begin>=0 && end>begin);
          const makeMount=new Function('isMobileYoutubeUi','window',text.slice(begin,end)+'\nreturn researchMount;');
          const title={}, media={contains:(node)=>node===title}, meta={};
          const card={matches:()=>false, querySelector:(selector)=>selector.includes('ytd-rich-grid-media')?media:meta, contains:()=>true};
          assert.strictEqual(makeMount(()=>false,{matchMedia:()=>({matches:true})})(card,title),media,'desktop grid row must be outside native title/details');
          assert.strictEqual(makeMount(()=>true,{matchMedia:()=>({matches:true})})(card,title),meta,'mobile placement must remain unchanged');
          assert.strictEqual(makeMount(()=>false,{matchMedia:()=>({matches:false})})(card,title),meta,'small viewport placement must remain unchanged');
          assert(text.includes('if (mount && bar.parentElement !== mount) mount.appendChild(bar);'),'existing bars must be relocated');
          assert(text.includes('ytd-rich-grid-media > .npf-research-meta'),'annotations need a full-width direct child');
          assert(text.includes('grid-column:1 / -1!important;'),'annotations must not share a grid column with titles');
          assert(text.includes("const NRH_DB_NAME = 'NijiResearchHelperDB';") && text.includes('const NRH_DB_VERSION = 1;'),'existing IndexedDB must remain compatible');
          console.log('PASS: desktop row separation, mobile/narrow fallback, existing bar relocation and DB compatibility');
          JS
      - name: Publish versioned userscript
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Niji_Research_Helper.user.js
          git commit -m "Separate desktop stream titles and research badges into rows (v1.0.33)"
          git push origin HEAD:main