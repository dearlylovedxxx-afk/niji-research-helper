name: Fix Rainbow Six FPS classification (one time)
on:
  push:
    paths:
      - .github/workflows/nrh-rainbow-fps-fix-once.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize Rainbow Six game labels and FPS detection
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Niji_Research_Helper.user.js')
          s = p.read_text(encoding='utf-8')
          replacements = [
              ('// @version      1.0.21', '// @version      1.0.22'),
              ("const VERSION = '1.0.21';", "const VERSION = '1.0.22';"),
              (r"['Rainbow Six Siege', /rainbow six|\br6s\b|シージ/i],", r"['Rainbow Six Siege', /rainbow[\s_-]*six|\br6s\b|シージ/i],"),
              (r'return /valorant|apex|overwatch|counter-strike|rainbow six|tarkov|pubg|fortnite|delta force|marvel rivals|battlefield|call of duty/i.test(`${game} ${title}`);', r'return /valorant|apex|overwatch|counter-strike|rainbow[\s_-]*six|\br6s\b|シージ|tarkov|pubg|fortnite|delta force|marvel rivals|battlefield|call of duty/i.test(`${game} ${title}`);'),
          ]
          for old, new in replacements:
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one occurrence, got {count}: {old[:70]}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
          node --check Niji_Research_Helper.user.js
          node - <<'JS'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const src = fs.readFileSync('Niji_Research_Helper.user.js', 'utf8');
          const gameSource = src.match(/function researchGameFromText\([\s\S]*?\n  }/);
          const fpsSource = src.match(/function isFpsGame\([\s\S]*?\n  }/);
          assert(gameSource && fpsSource);
          const normalizeResearchText = s => String(s).toLowerCase().replace(/[\s　]+/g, ' ').trim();
          const researchGameFromText = Function('normalizeResearchText', `${gameSource[0]}; return researchGameFromText;`)(normalizeResearchText);
          const isFpsGame = Function(`${fpsSource[0]}; return isFpsGame;`)();
          for (const label of ['Rainbow_Six', 'Rainbow Six', 'rainbow-six', 'R6S', 'シージ']) {
            assert.equal(researchGameFromText('', label), 'Rainbow Six Siege', `game: ${label}`);
            assert.equal(isFpsGame(label, ''), true, `fps: ${label}`);
          }
          assert.equal(isFpsGame('Minecraft', ''), false);
          console.log('PASS: Rainbow Six variants classify as FPS; Minecraft stays non-FPS');
          JS
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Niji_Research_Helper.user.js
          git commit -m 'Recognize Rainbow_Six and シージ as FPS (v1.0.22)'
          git push
