name: Patch POV nonoverlap coach once
on:
  push:
    paths:
      - '.github/workflows/patch_pov_coach_relevance_once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch userscript only
        run: python .github/scripts/patch_pov_coach_relevance_once.py
      - name: Validate syntax and exact screenshot regression
        run: |
          node --check Niji_Research_Helper.user.js
          node .github/scripts/test_pov_coach_relevance_once.js
          git diff --check
      - name: Commit only userscript
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Niji_Research_Helper.user.js
          git diff --cached --quiet && exit 1
          git commit -m 'Hide non-overlapping coach results only v1.0.47'
          git push origin HEAD:main