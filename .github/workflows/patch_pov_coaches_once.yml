name: Patch POV coach discovery once
on:
  push:
    paths:
      - '.github/workflows/patch_pov_coaches_once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply targeted coach discovery change
        run: python .github/scripts/patch_pov_coaches_once.py
      - name: Validate script and coach regression fixtures
        run: |
          node --check Niji_Research_Helper.user.js
          node .github/scripts/test_pov_coaches_once.js
          git diff --check
      - name: Commit updated helper only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Niji_Research_Helper.user.js
          git diff --cached --quiet && exit 1
          git commit -m 'Find coach streams and related archives v1.0.45'
          git push origin HEAD:main
