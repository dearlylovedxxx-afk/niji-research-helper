name: Patch YouTube POV supplement once
on:
  push:
    paths:
      - '.github/workflows/patch_youtube_pov_supplement_once.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch helper
        run: python .github/scripts/patch_youtube_pov_supplement_once.py
      - name: Validate JS
        run: |
          node --check Niji_Research_Helper.user.js
          git diff --check
          grep -q '@version      1.0.42' Niji_Research_Helper.user.js
          grep -q 'attachPovSupplement(source, matches, sec, results)' Niji_Research_Helper.user.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Niji_Research_Helper.user.js
          git commit -m 'Show supplemental POV search in YouTube panel v1.0.42'
          git push origin HEAD:main
