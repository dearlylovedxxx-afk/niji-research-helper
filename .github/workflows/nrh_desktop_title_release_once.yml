name: Repair desktop video title layout v1.0.32 (one time)
on:
  push:
    paths:
      - .github/workflows/nrh_desktop_title_release_once.yml
permissions:
  contents: write
jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guarded CSS repair and JavaScript syntax check
        run: python .github/scripts/nrh_desktop_title_patch_once.py
      - name: Regression checks for unchanged data keys and scoped layout
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('Niji_Research_Helper.user.js').read_text(encoding='utf-8')
          assert '// @version      1.0.32' in s and "const VERSION = '1.0.32';" in s
          assert s.count('Desktop grid: keep native video titles above research annotations.') == 1
          assert '@media (min-width:701px)' in s
          assert ':has(> .npf-research-meta)' in s
          assert 'flex-direction:column!important;' in s
          assert '-webkit-line-clamp:unset!important;' in s
          assert '// @namespace    niji-pov-helper' in s
          assert "const NRH_DB_NAME = 'NijiResearchHelperDB';" in s
          assert 'const NRH_DB_VERSION = 1;' in s
          assert "const KEY_WIKI_CACHE = 'npf_wiki_cache_v11';" in s
          assert 'function wikiExtractJoinPeople(' in s
          print('PASS: desktop-only layout rules, title unclamping, original DB and Wiki parsing preserved')
          PY
      - name: Publish versioned userscript
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Niji_Research_Helper.user.js
          git diff --cached --check
          git commit -m "Fix squashed desktop YouTube titles below thumbnails (v1.0.32)"
          git push origin HEAD:main
