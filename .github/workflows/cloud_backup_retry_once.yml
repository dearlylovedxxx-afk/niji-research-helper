name: Validate idempotent cloud backup retries
on:
  push:
    paths:
      - '.github/workflows/cloud_backup_retry_once.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/cloud_backup_retry_once.py
      - name: Validate JavaScript syntax and backup integrity assertions
        run: |
          node --check Niji_Cloud_Backup.user.js
          node --check cloud-backup/multi_app_gateway_extension.js
          python3 - <<'PY'
          from pathlib import Path
          s=Path('Niji_Cloud_Backup.user.js').read_text()
          assert 'await fetchBackup(existing)' in s
          assert "await xhr('POST','/parts',partBody)" in s
          assert 'const verify=await getBackups()' in s
          assert 'exportedAt:' not in s
          assert 'sortRows' not in s
          print('Idempotence and scope checks passed')
          PY
      - name: Publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Niji_Cloud_Backup.user.js
          git commit -m 'Verify unchanged backups and retry ambiguous multipart uploads'
          git push