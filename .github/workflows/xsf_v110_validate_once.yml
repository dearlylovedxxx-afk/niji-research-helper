name: Validate X Search Favorites userscript v1.1.0
on:
  push:
    paths:
      - .github/workflows/xsf_v110_validate_once.yml
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and functionality assertions
        run: |
          node --check X_Search_Favorites.user.js
          node <<'JS'
          const fs=require('fs'),vm=require('vm'),assert=require('node:assert/strict');
          const s=fs.readFileSync('X_Search_Favorites.user.js','utf8');
          for(const needle of ['// @version      1.1.0','@updateURL    https://raw.githubusercontent.com/dearlylovedxxx-afk/niji-research-helper/main/X_Search_Favorites.user.js','xsf_userscript_v1','savedSearches','JSON書き出し','JSONを読み込みました','本文一致','いいね順','function tweetLikes','function captureLikes','function parseQuery','function buildQuery']) assert(s.includes(needle),needle);
          // Run pure search builder and like-count parsing from the actual source.
          const from=s.indexOf('function dateShift('),until=s.indexOf('function navigate(');
          assert(from>0&&until>from);
          const block=s.slice(from,until);
          const context={URLSearchParams, Date};vm.createContext(context);
          vm.runInContext(block+'\nthis.helpers={buildQuery,parseQuery,dateShift};',context);
          const h=context.helpers;
          const f=h.parseQuery('猫 (犬 OR 鳥) -広告 from:sample min_faves:100 until:2026-09-22');
          assert.equal(f.fromUser,'@sample');assert.equal(f.minFaves,'100');assert.equal(f.untilDate,'2026-09-21');
          assert(h.buildQuery(f).includes('min_faves:100'));
          assert(h.buildQuery(f).includes('until:2026-09-22'));
          const start=s.indexOf('function parseLike('),end=s.indexOf('function tweetLikes(',start);
          vm.runInContext(s.slice(start,end)+'\nthis.parseLike=parseLike;',context);
          assert.equal(context.parseLike('1.2万'),12000);
          assert.equal(context.parseLike('2.3K'),2300);
          console.log('PASS: query roundtrip, date inclusion, like unit parsing, storage and userscript metadata');
          JS
