name: Release OR resumable chunks v0.4.5 verified
on:
  push:
    paths:
      - .github/workflows/or_v045_verified_release_once.yml
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply guarded chunk patch
        run: |
          sed -i "s/boot.textContent='🔀 OR起動中 0.4.4';/boot.textContent='🔀 OR起動中 0.4.3';/" .github/scripts/or_v045_resume_chunks_once.py
          python .github/scripts/or_v045_resume_chunks_once.py
      - name: Syntax and chunk recovery tests
        run: |
          node --check Niji_OR_Results_Merger.user.js
          git diff --check
          node <<'JS'
          const fs=require('fs'),assert=require('node:assert/strict'),vm=require('node:vm');
          const s=fs.readFileSync('Niji_OR_Results_Merger.user.js','utf8');
          const part=(a,b)=>{const i=s.indexOf(a),j=s.indexOf(b,i+a.length);assert(i>=0&&j>i);return s.slice(i,j)};
          for(const val of ['// @version      0.4.5',"const STORAGE_KEY = 'niji_or_merger_addon_batches_v1';","const RUN_KEY = 'niji_or_merger_addon_run_v041';","const MIN_COMMENTS_KEY = 'niji_or_merger_addon_minimum_v1';","@namespace    niji-or-results-merger-standalone",'runJob.collectedIds.push(item.id);known.add(item.id);',"runJob.stage='chunk-nav'",'button(resumeText,()=>void resumeRun())'])assert(s.includes(val),val);
          assert(!s.includes('if(runJob.list.length>MAX_RUN_VIDEOS) throw new Error'));
          const loc={href:'https://comment2434.com/comment/?keyword=x&least_count=10&page=15',origin:'https://comment2434.com'};
          const x={URL,location:loc,runJob:{seenPages:[loc.href]},runWord:()=> 'x',nextPageControl:()=>({matches:()=>true,getAttribute:()=>'/comment/?keyword=x&least_count=10&page=16'})};
          vm.runInNewContext(part('  function nextResultPageUrl() {','  async function beginDetailsAfterList() {'),x);
          assert.equal(x.nextResultPageUrl(),'https://comment2434.com/comment/?keyword=x&least_count=10&page=16');
          x.runJob.seenPages.push(x.nextResultPageUrl());assert.throws(()=>x.nextResultPageUrl(),/同じ検索ページ/);x.runJob.seenPages.pop();
          x.nextPageControl=()=>({matches:()=>true,getAttribute:()=>'/comment/?keyword=x&least_count=1&page=16'});assert.throws(()=>x.nextResultPageUrl(),/最低コメント数/);
          const u='https://comment2434.com/comment/?keyword=x&least_count=10&page=16';
          (async()=>{
            const paused={runJob:{stage:'chunk-paused',active:false,words:['x'],index:0,list:[{id:'a'}],pendingNextUrl:u,error:''},runDriving:false,message:{textContent:''},saveRun:async()=>{},render:()=>{},driveRun:()=>{},MAX_RUN_VIDEOS:150};
            vm.runInNewContext(part('  async function resumeRun() {','  async function persistRunPartial() {'),paused);
            await paused.resumeRun();assert.equal(paused.runJob.stage,'chunk-nav');assert.equal(paused.runJob.pendingNextUrl,u);
            const old={runJob:{stage:'list',active:false,words:['x'],index:0,list:Array.from({length:160},(_,i)=>({id:String(i)})),seenPages:['https://comment2434.com/comment/?keyword=x&page=16'],error:'安全上限150動画を超えたため停止しました'},runDriving:false,message:{textContent:''},saveRun:async()=>{},render:()=>{},driveRun:()=>{},MAX_RUN_VIDEOS:150};
            vm.runInNewContext(part('  async function resumeRun() {','  async function persistRunPartial() {'),old);
            await old.resumeRun();assert.equal(old.runJob.stage,'legacy-limit-prepare');assert.equal(old.runJob.collectedIds.length,160);
            let persisted=false;
            const ctx={runJob:{stage:'detail-open',active:true,list:[{id:'a'},{id:'b'}],pendingNextUrl:u,collectedIds:['a','b'],pages:2},persistRunPartial:async()=>{persisted=true;},saveRun:async()=>{},render:()=>{},message:{textContent:''}};
            vm.runInNewContext(part('  async function pauseRunChunk() {','  function looksLikeAccessDenied() {'),ctx);
            await ctx.pauseRunChunk();assert(persisted);assert.equal(ctx.runJob.completedVideos,2);assert.equal(ctx.runJob.active,false);assert.equal(ctx.runJob.stage,'chunk-paused');
            console.log('PASS v0.4.5: pagination, minimum threshold, page dedup, 150-video checkpoint, legacy 160-video recovery, persistent keys');
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
      - name: Publish verified userscript
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Niji_OR_Results_Merger.user.js
          git commit -m "Add resumable 150-video OR chunks with progress preservation (v0.4.5)"
          git push origin HEAD:main
