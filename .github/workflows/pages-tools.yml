name: Deploy tools to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "tools/**"
      - ".github/workflows/pages-tools.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-tools"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload tools
        uses: actions/upload-pages-artifact@v4
        with:
          path: tools
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
