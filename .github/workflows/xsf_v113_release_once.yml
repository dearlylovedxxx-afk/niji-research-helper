name: Release X Search Favorites rich post cards v1.1.3
on:
  push:
    paths:
      - .github/workflows/xsf_v113_release_once.yml
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply guarded patch
        run: python .github/scripts/xsf_rich_cards_v113_once.py
      - name: Syntax and media regression checks
        run: |
          node --check X_Search_Favorites.user.js
          git diff --check
          node <<'JS'
          const fs=require('fs'),assert=require('assert'),vm=require('vm');
          const s=fs.readFileSync('X_Search_Favorites.user.js','utf8');
          for(const v of ['// @version      1.1.3',"const VERSION='1.1.3'",'function tweetMedia(article)','result-avatar','result-media','result-video-tag','Xでこの投稿を開く','引用された投稿','function scanMore()'])assert(s.includes(v),v);
          assert(s.includes("KEY='xsf_userscript_v1'"),'keep original local storage key');
          assert(s.includes('https://raw.githubusercontent.com/dearlylovedxxx-afk/niji-research-helper/main/X_Search_Favorites.user.js'),'keep update URL');
          const begin=s.indexOf('function httpsImage('),end=s.indexOf('function captureLikes(){',begin);
          const context={location:{origin:'https://x.com'},URL};
          vm.runInNewContext(s.slice(begin,end),context);
          const picture={currentSrc:'https://pbs.twimg.com/media/photo123?format=jpg&name=small'};
          const avatar={currentSrc:'https://pbs.twimg.com/profile_images/avatar123'};
          const video={currentSrc:'https://pbs.twimg.com/ext_tw_video_thumb/123/pu/img/thumb.jpg'};
          const article={querySelectorAll(selector){
            if(selector.includes('tweetPhoto'))return [picture,avatar,video,picture];
            return [];
          },querySelector(){return {}}};
          const media=context.tweetMedia(article);
          assert.strictEqual(media.images.length,2,'dedupe attachments; exclude profile image');
          assert.strictEqual(media.hasVideo,true);
          assert(media.images[0].includes('/media/photo123'));
          assert(media.images[1].includes('/ext_tw_video_thumb/'));
          assert.strictEqual(context.httpsImage('javascript:alert(1)'),'');
          console.log('PASS syntax, thumbnail extraction, deduplication, video detection and storage compatibility');
          JS
      - name: Publish verified userscript
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add X_Search_Favorites.user.js
          git commit -m "Show X search results as recognizable media-rich posts (v1.1.3)"
          git push origin HEAD:main
