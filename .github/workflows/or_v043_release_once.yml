name: Release OR empty-page fix v0.4.3
on:
  push:
    paths:
      - .github/workflows/or_v043_release_once.yml
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply guarded code fix
        run: python .github/scripts/or_v043_empty_page_partial_once.py
      - name: Syntax and regression checks
        run: |
          node --check Niji_OR_Results_Merger.user.js
          git diff --check
          node - <<'JS'
          const s=require('fs').readFileSync('Niji_OR_Results_Merger.user.js','utf8');
          const assert=require('assert');
          for(const value of [
            '// @version      0.4.3',
            "const STORAGE_KEY = 'niji_or_merger_addon_batches_v1';",
            "const RUN_KEY = 'niji_or_merger_addon_run_v041';",
            'async function persistRunPartial()',
            'async function beginDetailsAfterList()',
            'function looksLikeAccessDenied()',
            'runJob.pages>0 && runJob.list.length && findKeywordForm()',
            'await beginDetailsAfterList();return;',
            'await persistRunPartial();',
            "void startRun();"
          ]) assert(s.includes(value),`Missing ${value}`);
          assert(s.includes('if (looksLikeAccessDenied()) throw new Error'));
          assert(s.includes('for (let attempt=0;attempt<3 && !found.length;attempt++)'));
          assert(!s.includes("void startMultiOr();}});"),'Old enter-key handler must be removed');
          console.log('PASS: userscript syntax and state/storage safeguards');
          JS
      - name: Publish tested userscript
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Niji_OR_Results_Merger.user.js
          git commit -m "Handle empty final OR pages and save comments incrementally (v0.4.3)"
          git push origin HEAD:main
