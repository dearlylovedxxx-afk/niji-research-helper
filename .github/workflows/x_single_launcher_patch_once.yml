name: X single launcher and inline backup once
on:
  push:
    paths:
      - .github/workflows/x_single_launcher_patch_once.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Patch X and backup scripts without modifying data schema
        run: python .github/scripts/x_single_launcher_patch_once.py
      - name: Validate syntax and scope
        run: |
          node --check X_Search_Favorites.user.js
          node --check Niji_Cloud_Backup.user.js
          git diff --check
          python - <<'PY'
          from pathlib import Path
          x=Path('X_Search_Favorites.user.js').read_text()
          b=Path('Niji_Cloud_Backup.user.js').read_text()
          assert "bar.append(launch);sh.append(bar);" in x
          assert "tools.append(importCurrent,filterBtn,sortBtn);" in x
          assert "tools.dataset.ncbSlot='x';" in x
          assert "if(app.id==='x'||nativeReady)" in b
          assert 'if(app.id===\'x\')launch.style.setProperty(\'display\',\'none\',\'important\');' in b
          assert '#bar #launch' not in b
          print('TEST_OK: single floating X button and native backup slot; both JS syntax checks passed')
          PY
      - name: Commit and publish verified scripts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- X_Search_Favorites.user.js Niji_Cloud_Backup.user.js
          git commit -m 'Consolidate X floating controls into Search and hide duplicate pCloud button'
          git push origin HEAD:main
